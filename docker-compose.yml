version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaflow_secure_db_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aquaflow_db}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquaflow-network

  redis:
    image: redis:7-alpine
    container_name: aquaflow-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquaflow-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/subhadeepchowdhury41/aquaflow-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquaflow-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-aquaflow_secure_db_2026}@postgres:5432/aquaflow_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-aquaflow_secure_db_2026}@postgres:5432/aquaflow_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-aquaflow-super-secret-jwt-key-change-in-prod-2026}
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aquaflow-network

  celery_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/subhadeepchowdhury41/aquaflow-backend:latest}
    container_name: aquaflow-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-aquaflow_secure_db_2026}@postgres:5432/aquaflow_db
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-aquaflow-super-secret-jwt-key-change-in-prod-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - aquaflow-network

  celery_beat:
    image: ${BACKEND_IMAGE:-ghcr.io/subhadeepchowdhury41/aquaflow-backend:latest}
    container_name: aquaflow-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-aquaflow_secure_db_2026}@postgres:5432/aquaflow_db
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-aquaflow-super-secret-jwt-key-change-in-prod-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - aquaflow-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/subhadeepchowdhury41/aquaflow-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquaflow-frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - aquaflow-network

networks:
  aquaflow-network:
    name: aquaflow-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
